<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colosseum Clash | Cinematic 3D Chess Battle</title>
    <meta
      name="description"
      content="Colosseum Clash: a cinematic 3D chess battle built for Vibe Jam 2026."
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://unpkg.com" />

    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #050607;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #scene-root {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      #scene-root canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #menu-root {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      #menu-root > * {
        pointer-events: auto;
      }

      #boot-overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #14171f 0%, #050607 65%);
        transition: opacity 380ms ease;
      }

      #boot-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Colosseum Clash game shell">
      <section id="scene-root" aria-label="3D scene"></section>
      <section id="menu-root" aria-label="Main menu overlay"></section>

      <div id="boot-overlay" role="status" aria-live="polite">
        <div class="text-center px-6">
          <p class="text-amber-200/95 text-2xl font-semibold tracking-[0.2em]">COLOSSEUM CLASH</p>
          <p class="mt-3 text-slate-300/80 text-sm tracking-[0.12em] uppercase">Preparing the arena...</p>
        </div>
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
    <script async src="https://jam.pieter.com/2026/widget.js"></script>
  </body>
</html>
